<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SITTA UT - Informasi Bahan Ajar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==========================================
         HEADER
         ========================================== -->

    <header id="main-header"></header>


    <!-- ==========================================
         KONTEN UTAMA
         ========================================== -->

    <main class="container stock-page">


        <!-- ======================================
             JUDUL HALAMAN
             ====================================== -->

        <div class="page-heading">

            <h1>
                Informasi Bahan Ajar
            </h1>

            <p>
                Kelola dan lihat informasi stok
                bahan ajar.
            </p>

        </div>


        <!-- ======================================
             TAMBAH DATA
             ====================================== -->

        <section class="card">

            <h2 class="card-title">
                Tambah Data Bahan Ajar
            </h2>

            <form id="form-tambah-stok">

                <div class="stock-form-grid">

                    <div class="form-group">

                        <label for="add-lokasi">
                            Kode Lokasi
                        </label>

                        <input
                            type="text"
                            id="add-lokasi"
                            placeholder="Contoh: 0TMP01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="add-kode">
                            Kode Barang
                        </label>

                        <input
                            type="text"
                            id="add-kode"
                            placeholder="Contoh: EKMA4111"
                            required
                        >

                    </div>


                    <div class="form-group stock-form-full">

                        <label for="add-nama">
                            Nama Barang
                        </label>

                        <input
                            type="text"
                            id="add-nama"
                            placeholder="Contoh: Pengantar Akuntansi"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="add-jenis">
                            Jenis Barang
                        </label>

                        <input
                            type="text"
                            id="add-jenis"
                            value="BMP"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="add-edisi">
                            Edisi
                        </label>

                        <input
                            type="text"
                            id="add-edisi"
                            placeholder="Contoh: 1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="add-stok">
                            Jumlah Stok
                        </label>

                        <input
                            type="number"
                            id="add-stok"
                            placeholder="Contoh: 100"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn stock-submit"
                >
                    + Tambah Data
                </button>

            </form>

        </section>


        <!-- ======================================
             RINGKASAN STOK
             ====================================== -->

        <section class="stock-summary">

            <div class="stock-summary-item">

                <span
                    class="stock-summary-number"
                    id="stock-total-jenis"
                >
                    0
                </span>

                <span class="stock-summary-label">
                    Jenis Bahan Ajar
                </span>

            </div>


            <div class="stock-summary-item">

                <span
                    class="stock-summary-number"
                    id="stock-total-stok"
                >
                    0
                </span>

                <span class="stock-summary-label">
                    Total Stok
                </span>

            </div>

        </section>


        <!-- ======================================
             DAFTAR BAHAN AJAR
             ====================================== -->

        <section class="card">

            <h2 class="card-title">
                Daftar Bahan Ajar
            </h2>


            <!-- ==============================
                 TAMPILAN DESKTOP
                 ============================== -->

            <div class="stock-table-wrapper">

                <table id="tabel-stok">

                    <thead>

                        <tr>
                            <th>No</th>
                            <th>Kode Lokasi</th>
                            <th>Kode Barang</th>
                            <th>Nama Barang</th>
                            <th>Jenis</th>
                            <th>Edisi</th>
                            <th>Stok</th>
                            <th>Aksi</th>
                        </tr>

                    </thead>

                    <tbody id="tbody-stok">

                        <!--
                            Data bahan ajar
                            dimasukkan oleh JavaScript
                        -->

                    </tbody>

                </table>

            </div>


            <!-- ==============================
                 TAMPILAN MOBILE
                 ============================== -->

            <div
                id="stock-card-list"
                class="stock-card-list"
            >

                <!--
                    Data bahan ajar
                    dimasukkan oleh JavaScript
                -->

            </div>

        </section>


    </main>


    <!-- ==========================================
         MODAL DETAIL
         ========================================== -->

    <div
        id="modal-detail"
        class="modal"
    >

        <div class="modal-content stock-detail-modal">

            <button
                type="button"
                class="close"
                id="close-detail"
                aria-label="Tutup"
            >
                &times;
            </button>


            <h3>
                Detail Bahan Ajar
            </h3>

            <p class="detail-subtitle">
                Informasi lengkap bahan ajar
            </p>


            <!-- Cover -->

            <div class="detail-cover-wrapper">

                <img
                    id="detail-cover"
                    src=""
                    alt="Cover Bahan Ajar"
                >

            </div>


            <!-- Informasi -->

            <div class="form-group">

                <label>
                    Kode Lokasi
                </label>

                <input
                    type="text"
                    id="detail-lokasi"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Kode Barang
                </label>

                <input
                    type="text"
                    id="detail-kode"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Nama Barang
                </label>

                <input
                    type="text"
                    id="detail-nama"
                    readonly
                >

            </div>


            <div class="detail-grid">

                <div class="form-group">

                    <label>
                        Jenis Barang
                    </label>

                    <input
                        type="text"
                        id="detail-jenis"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label>
                        Edisi
                    </label>

                    <input
                        type="text"
                        id="detail-edisi"
                        readonly
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Stok
                </label>

                <input
                    type="text"
                    id="detail-stok"
                    readonly
                >

            </div>


            <button
                type="button"
                class="btn btn-block detail-close-btn"
                id="btn-tutup-detail"
            >
                Tutup
            </button>

        </div>

    </div>


    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script src="js/data.js?v=1.1"></script>
    <script src="js/script.js?v=1.1"></script>

</body>

</html>
